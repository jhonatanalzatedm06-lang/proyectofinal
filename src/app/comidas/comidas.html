<!-- Contenedor principal que empuja el footer hacia abajo -->
<div class="page-container">

  <!-- Barra Superior (Título y Buscadores alineados) -->
  <div class="container-fluid barra-superior">
    <div class="row align-items-center">
      
      <!-- Título Categorías (Izquierda en PC, Arriba en Móvil) -->
      <div class="col-lg-6 mb-4 mb-lg-0">
        <div class="titulo-categorias h-100 d-flex align-items-center justify-content-center">
          <h2 class="m-0">CATEGORÍAS 🍣</h2>
        </div>
      </div>

      <!-- Buscadores (Derecha en PC, Abajo en Móvil) -->
      <div class="col-lg-6">
        <div class="filtros-container">
          
          <div class="input-group shadow-sm">
            <input type="text" class="form-control custom-input" placeholder="Buscar Comida por Nombre . . ." name="inputNombreTop" [(ngModel)]="textoNombre">
            <button class="btn btn-dorado" type="button" (click)="buscarNombre()">Buscar</button>
          </div>
          
          <div class="input-group shadow-sm">
            <input type="text" class="form-control custom-input" placeholder="Buscar Comida por Ingrediente . . ." name="inputIngredienteTop" [(ngModel)]="textoIngrediente">
            <button class="btn btn-dorado" type="button" (click)="buscarIngrediente()">Buscar</button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Sección de Categorías -->
  <section class="container-fluid py-2">
    <div class="row categorias-row justify-content-center">
      <div *ngFor="let c of categorias" class="col-lg-2 col-md-3 col-sm-4 col-6 mb-3">
        <div class="card categoria-card text-center border-0 shadow-lg mx-auto">
          <img [src]="c.strCategoryThumb" class="card-img-top rounded-top" alt="{{ c.strCategory }}">
          <div class="card-body">
            <h5 class="card-title text-warning fw-semibold">{{ c.strCategory }}</h5>
            <button class="btn btn-outline-warning w-100" (click)="verComidas(c.strCategory)">
              Ver comidas
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Sección Nuestras Comidas -->
  <section class="container-fluid p-0 mt-4">
    <div *ngIf="comidas && comidas.length > 0" class="row justify-content-center mb-4">
      <div class="col-12 text-center">
        <h2 class="text-warning fw-bold titulo-comidas">Nuestras Comidas</h2>
        <hr class="border-warning w-25 mx-auto">
      </div>
    </div>

    <div class="row justify-content-center mx-auto" style="max-width: 95%;">
      <div *ngFor="let m of comidas" class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <div class="card comida-card text-center border-0 shadow-lg">
          <img [src]="m.imagen" class="card-img-top rounded-top" alt="{{ m.nombre }}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-warning fw-semibold">{{ m.nombre }}</h5>
            <p class="card-text text-light flex-grow-1">
              Ingredientes: {{ m.ingredientes.join(", ") }}
            </p>
            
            <div class="d-flex align-items-center gap-2 mt-auto">
              <input type="number" class="form-control text-center text-black border-secondary rounded-2 shadow-sm" style="width: 70px; height: 38px;" [(ngModel)]="m.cantidad" min="1">
              <button (click)="agregarComida(m)" class="btn btn-warning text-dark flex-grow-1 fw-bold rounded-2 shadow-sm d-flex align-items-center justify-content-center gap-2" style="height: 38px;">
                🛒 Comprar
              </button>
              
              <div class="position-absolute top-0 end-0 m-2">
                <span class="badge rounded-pill px-3 py-2 border border-warning border-opacity-30 shadow-sm text-warning" style="background-color: rgba(9, 14, 20, 0.85); backdrop-filter: blur(6px); font-size: 0.85rem; font-weight: 500;">
                  $ {{ m.precio | number }}
                </span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- Modal -->
<div class="modal fade" id="myModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title w-100 text-center">COMPRA DE COMIDAS</h4>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        {{mensajeModal}}
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-danger px-4" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>
